<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/overrides.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #f8f8fb; }
    .error-box { background: #fff; padding: 4rem 2rem; border-radius: 10px; border: 1px solid #e8e8ef; max-width: 500px; }
    h1 { font-size: 4rem; color: #4c8bf5; margin-bottom: 1rem; }
    p { margin-bottom: 2rem; color: #555; }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/" class="button">Return Home</a>
  </div>
</body>
</html>
